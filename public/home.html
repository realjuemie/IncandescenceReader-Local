<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var theme = "";
      try { theme = localStorage.getItem("xglow-theme") || ""; } catch (e) {}
      var dark = theme === "dark";
      if (theme !== "dark" && theme !== "light") {
        try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
      }
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
    })();
  </script>
  <title>X拾光 · 账号导航</title>
  <link rel="icon" href="/xglow-favicon.png?v=4.13.1" type="image/png">
  <link rel="shortcut icon" href="/xglow-favicon.png?v=4.13.1" type="image/png">
  <link rel="stylesheet" href="/styles.css?v=4.18.0">
  <link rel="stylesheet" href="/assistant/assistant.css?v=1.1.0">
</head>
<body class="home-body">
  <header class="home-topbar">
    <a class="admin-brand" href="/">
      <img class="site-logo" src="/xglow-icon.png?v=4.13.1" alt="">
      <span><strong>X拾光</strong><small>XGlow · 本地 X 内容导航</small></span>
    </a>
    <div class="home-topbar-actions">
      <button class="language-toggle" type="button" data-language-toggle><span aria-hidden="true">文</span><b data-language-label>EN</b></button>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换明暗"><span aria-hidden="true" data-theme-icon>☾</span><b data-theme-label>暗</b></button>
      <div class="public-member-status" id="home-member-status"></div>
    </div>
  </header>

  <main class="home-main">
    <section class="home-hero">
      <div class="home-hero-copy">
        <div class="eyebrow">CURATED LOCALLY</div>
        <h1>关注的人，<br><em>安静地留在这里。</em></h1>
        <p>选择一个账号阅读已保存到本站的内容，或者前往其 X 官方主页。本站不会要求访客登录 X。</p>
        <div class="home-summary" id="home-summary">正在读取账号…</div>
      </div>
      <div class="home-orbit" aria-hidden="true">
        <img src="/xglow-icon.png?v=4.13.1" alt="">
      </div>
    </section>

    <section class="home-directory">
      <header>
        <div class="home-directory-heading">
          <div class="eyebrow">ACCOUNT DIRECTORY</div>
          <h2>账号导航</h2>
          <span class="home-refresh-time" id="home-refresh-time"></span>
        </div>
        <div class="home-directory-tools">
          <button type="button" class="home-public-toggle" id="home-public-toggle" hidden aria-pressed="false"></button>
          <div class="home-layout-toggle" role="group" aria-label="账号显示方式">
            <button type="button" data-home-layout="banner" aria-pressed="true" title="切换为横幅显示">横幅</button>
            <button type="button" data-home-layout="compact" aria-pressed="false" title="切换为小组件显示">组件</button>
          </div>
        </div>
      </header>
      <div class="account-filter-bar home-account-filter">
        <label class="account-filter-field" for="home-account-search">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m20.5 20.5-4.3-4.3m2.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
          <input type="search" id="home-account-search" autocomplete="off" spellcheck="false" placeholder="搜索名称、@账号或 ID" aria-label="搜索名称、@用户名或账号 ID">
        </label>
        <span class="account-filter-count" id="home-account-search-count" aria-live="polite"></span>
      </div>
      <div class="home-account-grid" id="home-account-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="home-footer">
    <span><strong>XGlow</strong> · 媒体与内容保存在站点本地</span>
  </footer>

  <div class="toast" id="toast" role="status"></div>
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="/telegram-miniapp.js?v=4.17.9" defer></script>
  <script src="/i18n.js?v=4.16.0" defer></script>
  <script src="/member-notifications.js?v=4.17.7" defer></script>
  <script src="/account-search.js?v=4.14.5" defer></script>
  <script src="/home.js?v=4.15.1" defer></script>
  <script src="/assistant/engine/geometry-data.js" defer></script>
  <script src="/assistant/engine/math.js" defer></script>
  <script src="/assistant/engine/tables.js" defer></script>
  <script src="/assistant/engine/pose.js" defer></script>
  <script src="/assistant/engine/tricks.js" defer></script>
  <script src="/assistant/engine/fx.js" defer></script>
  <script src="/assistant/engine/eyes.js" defer></script>
  <script src="/assistant/engine/character.js" defer></script>
  <script src="/assistant/assistant.js?v=1.1.0" defer></script>
</body>
</html>
