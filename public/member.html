<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>X拾光 · 会员登录</title>
  <link rel="icon" href="/xglow-favicon.png?v=4.13.1" type="image/png">
  <link rel="shortcut icon" href="/xglow-favicon.png?v=4.13.1" type="image/png">
  <link rel="stylesheet" href="/styles.css?v=4.16.2">
</head>
<body class="member-body">
  <main class="member-auth-view">
    <section class="member-auth-card">
      <div class="member-auth-brand-row">
        <a class="member-login-brand" href="/">
          <img src="/xglow-icon.png?v=4.13.1" alt="">
          <span>X拾光 <small>XGlow</small></span>
        </a>
        <button class="language-toggle" type="button" data-language-toggle><span aria-hidden="true">文</span><b data-language-label>EN</b></button>
      </div>
      <div class="eyebrow">MEMBER ACCESS</div>
      <h1>会员登录</h1>
      <p>登录后可查看管理员分配给你的用户和本地归档内容。</p>

      <form id="member-login-form">
        <label>会员名
          <input id="member-username" autocomplete="username" maxlength="32" required>
        </label>
        <label>密码
          <input id="member-password" type="password" autocomplete="current-password" maxlength="256" required>
        </label>
        <button class="primary-button wide-button" id="member-login-submit" type="submit">登录并继续</button>
      </form>

      <div class="member-current" id="member-current" hidden>
        <strong id="member-current-name"></strong>
        <span>当前会员已登录</span>
        <a class="primary-button button-link wide-button" id="member-continue" href="/">继续阅读</a>
        <button class="secondary-button wide-button" id="member-logout" type="button">退出当前会员</button>
      </div>

      <div class="auth-error" id="member-login-error" role="alert"></div>
      <a class="back-reader-link" href="/">← 返回账号导航</a>
    </section>
  </main>
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="/telegram-miniapp.js?v=4.16.1" defer></script>
  <script src="/i18n.js?v=4.16.0" defer></script>
  <script src="/member.js?v=4.15.0" defer></script>
</body>
</html>
